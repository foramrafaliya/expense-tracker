name: Backend CI/CD

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Determine version tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi

      # Ye step ab deploy-backend.sh ko call karta hai - jisme
      # version switch + health check + automatic rollback sab already likha hai
      - name: Deploy to EC2 (with automatic rollback on failure)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            bash /home/ubuntu/deploy-scripts/deploy-backend.sh ${{ steps.version.outputs.VERSION }}

      - name: Report deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment of ${{ steps.version.outputs.VERSION }} succeeded and is live."
          else
            echo "❌ Deployment of ${{ steps.version.outputs.VERSION }} failed health check. Auto-rollback was attempted on the server."
          fi
