name: Backend CI/CD

# This workflow triggers ONLY when files inside the backend/ folder change.
# If frontend/ files change, this workflow will NOT run.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run basic sanity check
        working-directory: ./backend
        run: node -e "require('./server.js')" & sleep 2 && curl -f http://localhost:5000/health && kill %1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            cd /home/ubuntu/expense-tracker
            git pull origin main
            cd backend
            npm ci
            sudo systemctl restart expense-backend
            sleep 2
            curl -f http://localhost:5000/health || (echo "Health check failed" && exit 1)
            echo "Backend deployed successfully"
