# Place this file at /etc/nginx/sites-available/expense-tracker
# Then: sudo ln -s /etc/nginx/sites-available/expense-tracker /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl restart nginx

server {
    listen 80;
    server_name _;

    # Serve the built React frontend
    root /home/ubuntu/expense-tracker/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Proxy API calls to the Node/Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}
